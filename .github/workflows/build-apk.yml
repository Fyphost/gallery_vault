name: Build APK

# Builds a ready-to-install debug APK on GitHub's runners (which have the Android
# SDK + internet to download dependencies). The APK is published two ways:
#   1. As a workflow artifact (Actions run -> Artifacts -> vault-gallery-debug-apk)
#   2. As a downloadable file on a GitHub Release (for tag pushes, e.g. v1.0.0)

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*" ]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

permissions:
  contents: write          # needed to attach the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-gallery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
